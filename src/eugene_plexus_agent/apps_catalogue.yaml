# The apps this agent release ships: a list of AppManifest entries
# (specs openapi/agent.yaml). A new app in a later release is a new row
# here -- the agent needs no new code for it. Each of our own apps' `source`
# is an archive at a pinned commit and its `version` is that commit, the way
# the installers pin the hub's own packages; an app published on the Python
# Package Index by its own project is `source: pypi` at an exact release.
#
# A catalogue entry names a commit on the app's `dist` branch where it has
# one: `main` at a named commit plus its built front end, which `main`
# gitignores and a GitHub archive would otherwise not carry (C3,
# workbench-v1.md W10). The order apps arrive in is specs
# docs/design/apps-and-spokes.md.

- id: workbench
  name: Workbench
  summary: >-
    Chat with the models this install serves, search the web, make images,
    video, speech and transcripts, and use shared MCP tools with approval per call. The owner can also run local MCP
    servers in Workbench's own OS account and grant folders to named people
    for approved file operations. Signs people in with Eugene:
    the owner with the passphrase, a small business with an account for each person.
  homepage: https://github.com/eugene-plexus/workbench
  source: https://github.com/eugene-plexus/workbench/archive/af67506fc6c971336359f647537c5bdea489b56c.tar.gz
  version: af67506fc6c971336359f647537c5bdea489b56c
  package: eugene-plexus-workbench
  entry: eugene_plexus_workbench
  python: "3.12"
  ui: true
  configTrio: true
  uses: [inference]
  signIn: true
  signInCallbackPath: /oidc/callback
  # Central Workbench can run without local actions. Its local MCP/file paths
  # enforce the app-account boundary themselves; enrolled node helpers have
  # their own isolated workers. This allows hosting Workbench in Docker/macOS.
  localActions: false

# The first app here that we did not write (C4, specs
# docs/design/c4-open-webui.md): installed unmodified from the Python
# Package Index at an exact release, started as its console script starts
# it, and told where things are through variables of its own. Its tools run
# Python its admin pastes in, so it installs only where it gets an account
# of its own.
- id: open-webui
  name: Open WebUI
  summary: >-
    A widely used chat interface, by a separate project, under its own
    licence. Installed unmodified. About 1.8 GB on disk and up to 2 GB of
    memory.
  homepage: https://openwebui.com
  licenseUrl: https://github.com/open-webui/open-webui/blob/v0.11.4/LICENSE
  source: pypi
  version: 0.11.4
  package: open-webui
  entry: open_webui:app
  args: [serve, --host, "{bindHost}", --port, "{port}"]
  python: "3.12"
  ui: true
  configTrio: false
  uses: [inference]
  signIn: true
  signInCallbackPath: /oauth/oidc/callback
  healthPath: /ready
  localActions: true
  resetOnConnectionChange: RESET_CONFIG_ON_START
  environment:
    DATA_DIR: "{dataDir}"
    STATIC_DIR: "{dataDir}/static"
    HF_HOME: "{dataDir}/hf"
    WEBUI_SECRET_KEY: "{appSecret}"
    WEBUI_URL: "{appUrl}"
    CORS_ALLOW_ORIGIN: "{appUrl}"
    OPENAI_API_BASE_URL: "{gatewayUrl}/v1"
    OPENAI_API_KEY: "{clientKey}"
    # Every other place Open WebUI would send to OpenAI's API is the gateway's
    # too. Its config.py (0.11.4) ends its OpenAI section by setting
    # OPENAI_API_BASE_URL back to https://api.openai.com/v1 and OPENAI_API_KEY
    # to the key of that address, which is empty here (lines 362-367), and each
    # address after that which is not given defaults to the reset one: its
    # documents' embeddings (RAG_, line 1098), images (IMAGES_, 1505), image
    # edits (IMAGES_EDIT_, 1535), speech to text (AUDIO_STT_, 1580) and text to
    # speech (AUDIO_TTS_, 1621), and their keys beside them. Without these an
    # uploaded document's text went to https://api.openai.com/v1/embeddings
    # (found in MR6's rehearsal; refused there for want of a key). A later
    # release may add another: read its config.py for OPENAI_API_BASE_URL when
    # the version above moves.
    RAG_OPENAI_API_BASE_URL: "{gatewayUrl}/v1"
    RAG_OPENAI_API_KEY: "{clientKey}"
    IMAGES_OPENAI_API_BASE_URL: "{gatewayUrl}/v1"
    IMAGES_OPENAI_API_KEY: "{clientKey}"
    IMAGES_EDIT_OPENAI_API_BASE_URL: "{gatewayUrl}/v1"
    IMAGES_EDIT_OPENAI_API_KEY: "{clientKey}"
    AUDIO_STT_OPENAI_API_BASE_URL: "{gatewayUrl}/v1"
    AUDIO_STT_OPENAI_API_KEY: "{clientKey}"
    AUDIO_TTS_OPENAI_API_BASE_URL: "{gatewayUrl}/v1"
    AUDIO_TTS_OPENAI_API_KEY: "{clientKey}"
    ENABLE_OLLAMA_API: "false"
    # Document search through Eugene's own door (MR6, specs
    # docs/design/workbench-memory-and-documents.md). Open WebUI copies these
    # into its database at its first start and its database wins after, so what
    # is running at its first start is what it keeps; its admin changes them in
    # its Admin Settings, Documents, which warns about re-reading documents.
    # {embeddingModel} and {rerankModel} are the first models the gateway lists
    # for this app's key that run on this install's own machines and embed, or
    # sort results, a running one before a stopped one (read at every start;
    # with none the variable is left unset and the start's notes say why). The
    # sorter is used only when {rerankModel} has a value. A change of search
    # model never resets the app's settings: resetOnConnectionChange follows the
    # gateway's address, the app's key and these variables as written here, with
    # the models unfilled, so correcting one reaches an install that started
    # before, once, and the vectors it stored stay with the model that made
    # them. Hybrid search is on because words plus meaning beat either alone in
    # Eugene's own measurement (MR5, 60 questions: recall@5 0.600 against 0.500
    # and 0.583, a small margin), and Open WebUI runs it with or without a
    # sorter.
    RAG_EMBEDDING_ENGINE: openai
    RAG_EMBEDDING_MODEL: "{embeddingModel}"
    RAG_RERANKING_ENGINE: external
    RAG_RERANKING_MODEL: "{rerankModel}"
    RAG_EXTERNAL_RERANKER_URL: "{gatewayUrl}/v1/rerank"
    RAG_EXTERNAL_RERANKER_API_KEY: "{clientKey}"
    ENABLE_RAG_HYBRID_SEARCH: "true"
    # Embeddings go out this many passages to a request, this many requests at
    # a time. Open WebUI's defaults are one passage to a request (config.py,
    # line 1019) and no limit on how many go together (line 1025; 0 is none),
    # so every passage of a file is sent in the same moment (retrieval/utils.py,
    # lines 1165-1181), and the first 429 fails the whole file: a request raises
    # on any error status and nothing tries it again (lines 929-955). An app's
    # key has limits (8 at once, 600 a minute), and a 10-passage file was served
    # 2 of 10 (MR6's acceptance). 32 passages to a request, one request at a
    # time, is about 32 times fewer requests and none together.
    RAG_EMBEDDING_BATCH_SIZE: "32"
    RAG_EMBEDDING_CONCURRENT_REQUESTS: "1"
    AUDIO_STT_ENGINE: openai
    OFFLINE_MODE: "true"
    ENABLE_VERSION_UPDATE_CHECK: "false"
    ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "false"
    SCARF_NO_ANALYTICS: "true"
    DO_NOT_TRACK: "true"
    ANONYMIZED_TELEMETRY: "false"
    ENABLE_SIGNUP: "false"
    ENABLE_LOGIN_FORM: "false"
    ENABLE_OAUTH_SIGNUP: "true"
    OAUTH_PROVIDER_NAME: Eugene
    OPENID_PROVIDER_URL: "{oidcIssuer}/.well-known/openid-configuration"
    OAUTH_CLIENT_ID: "{oidcClientId}"
    OAUTH_CLIENT_SECRET: "{oidcClientSecret}"
    OAUTH_CODE_CHALLENGE_METHOD: S256
    OAUTH_SCOPES: openid email profile
    OAUTH_EMAIL_CLAIM: email
    OAUTH_USERNAME_CLAIM: name
    ENABLE_OAUTH_EMAIL_FALLBACK: "true"
    ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
    OAUTH_ROLES_CLAIM: eugene_role
    OAUTH_ADMIN_ROLES: operator
    OAUTH_ALLOWED_ROLES: operator,member
